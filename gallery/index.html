<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery - Yuhong Dai</title>
  <link rel="stylesheet" href="../stylesheet.css">
</head>
<body class="bg_colour">
  <main class="container">
    <a href="../index.html" class="back-link" data-i18n="backHome">← Back to home</a>

    <header class="section" style="padding-top: 0;">
      <h1 class="page-title" data-i18n="pageTitle">Gallery</h1>
      <p class="page-subtitle" data-i18n="pageSubtitle">Photography and moments I like</p>
      <div class="header-actions">
        <button id="language-toggle" class="lang-toggle" type="button">中文</button>
      </div>
    </header>

    <div id="gallery" class="gallery" aria-label="Photo gallery"></div>
    <noscript><p class="loading">This gallery needs JavaScript to display.</p></noscript>
  </main>

  <script>
    // Photo data — regenerated by gallery/update-gallery.py. Do not edit by hand.
    const galleryPhotos = [
      {
        "thumb": "../images/gallery/thumbs/sydney-kiama.jpg",
        "full": "../images/gallery/sydney-kiama.jpg",
        "caption": "2026.10.05 Kiama, Sydney",
        "date": "2026-10-05"
      }
    ];

    const translations = {
      en: {
        backHome: '← Back to home',
        pageTitle: 'Gallery',
        pageSubtitle: 'Photography and moments I like'
      },
      zh: {
        backHome: '← 返回主页',
        pageTitle: '摄影作品',
        pageSubtitle: '记录一些喜欢的瞬间'
      }
    };

    function renderGallery() {
      const wrap = document.getElementById('gallery');
      wrap.innerHTML = '';

      galleryPhotos.forEach((photo) => {
        const figure = document.createElement('figure');
        figure.className = 'gallery-item';

        const link = document.createElement('a');
        link.href = photo.full;
        link.target = '_blank';
        link.rel = 'noopener';

        const img = document.createElement('img');
        img.src = photo.thumb;
        img.alt = photo.caption || 'Gallery photo';
        img.loading = 'lazy';
        img.decoding = 'async';

        link.appendChild(img);
        figure.appendChild(link);

        if (photo.caption) {
          const caption = document.createElement('figcaption');
          caption.className = 'gallery-caption';
          caption.textContent = photo.caption;
          figure.appendChild(caption);
        }

        wrap.appendChild(figure);
      });
    }

    function updateLanguage(lang) {
      document.documentElement.lang = lang;
      localStorage.setItem('lang', lang);

      document.querySelectorAll('[data-i18n]').forEach((el) => {
        const key = el.getAttribute('data-i18n');
        const value = translations[lang][key];
        if (value !== undefined) {
          el.innerHTML = value;
        }
      });

      const toggle = document.getElementById('language-toggle');
      toggle.textContent = lang === 'en' ? '中文' : 'English';
      toggle.setAttribute('aria-label', lang === 'en' ? 'Switch language to Chinese' : '切换到英文');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderGallery();

      const stored = localStorage.getItem('lang');
      const initial = stored || document.documentElement.lang || 'en';
      updateLanguage(initial);

      document.getElementById('language-toggle').addEventListener('click', () => {
        updateLanguage(document.documentElement.lang === 'en' ? 'zh' : 'en');
      });
    });
  </script>
</body>
</html>
